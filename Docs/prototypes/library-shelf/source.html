<!-- Throwaway planning prototype: Shelf throughout All, Collections, and Authors; cover fans for groups. No EPUB, download, or synchronization validation. -->
<div id="epub-library-preview" class="viz-dotted-background" aria-label="Library shelves and cover fans">
  <section data-variant="Shelf" aria-label="Library shelf"></section>
</div>
<style>
#epub-library-preview .phone{--paper:light-dark(#faf9f5,#20221f);--ink:light-dark(#252c26,#f1f2ec);--soft:light-dark(#e9ede5,#343c34);--line:light-dark(#d5dcd1,#495448);--accent:light-dark(#315943,#b8d9b8);--accentInk:light-dark(#ffffff,#172b1d);--secondaryInk:light-dark(#57614f,#c4ccbc);font:16px/1.45 system-ui,sans-serif;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:24px;width:min(100%,390px);min-height:740px;margin:24px auto 12px;padding:20px 16px 16px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column}
#epub-library-preview section{min-height:776px;padding:24px 10px 12px}
#epub-library-preview .phone *{box-sizing:border-box}
#epub-library-preview .appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}
#epub-library-preview h2{font-size:23px;font-weight:500;line-height:1.3;margin:0}
#epub-library-preview h3{font-size:18px;font-weight:500;margin:0 0 16px;overflow-wrap:anywhere}
#epub-library-preview button{font:inherit;color:inherit;background:transparent;border:0;border-radius:10px;min-height:44px;padding:8px 12px}
#epub-library-preview .phone{height:740px;margin:0 auto}
#epub-library-preview .content{flex:1;min-height:0;overflow-y:auto}
#epub-library-preview .appbar,#epub-library-preview .heading,#epub-library-preview .tools,#epub-library-preview .tabs{flex-shrink:0}
#epub-library-preview .tabs{display:flex;gap:0;align-self:stretch;align-items:center;margin:0 0 12px;padding:0;border-bottom:1px solid var(--line)}
#epub-library-preview .tabs button{flex:1;min-width:0;height:44px;padding:8px;display:grid;place-items:center;border-radius:10px 10px 0 0;border-bottom:3px solid transparent}
#epub-library-preview .tabs button[aria-pressed=true]{color:var(--accent);background:var(--soft);border-bottom-color:var(--accent)}
#epub-library-preview .settings-button{width:44px;height:44px;padding:10px;display:grid;place-items:center}
#epub-library-preview .tabs svg,#epub-library-preview .settings-button svg{width:24px;height:24px}
#epub-library-preview .tools{display:flex;gap:8px;margin-bottom:14px}
#epub-library-preview input,#epub-library-preview select{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;min-width:0}
#epub-library-preview .tools input{width:100%;flex:1}
#epub-library-preview .tools select{width:118px}
#epub-library-preview .books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#epub-library-preview .book{position:relative;min-width:0;display:block;padding:10px 10px 46px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
#epub-library-preview .cover{height:156px;width:100%;border-radius:4px;padding:0;overflow:hidden;display:grid;place-items:center;position:relative;background:var(--soft);color:var(--accent)}
#epub-library-preview .cover-art{width:100%;height:100%;display:grid;place-items:center;position:relative;background:light-dark(#dce7d8,#3b5142);color:light-dark(#244731,#dfecdf);border:1px solid var(--line);border-radius:4px;overflow:hidden}
#epub-library-preview .cover-art[data-art="2"]{background:light-dark(#e1dbcb,#514d3b);color:light-dark(#554329,#eee7d6)}
#epub-library-preview .cover-art[data-art="3"]{background:light-dark(#d7e2ea,#384c5b);color:light-dark(#28485d,#dbeaf2)}
#epub-library-preview .cover-art::before{content:'';position:absolute;inset:14% 14%;border:1px solid currentColor}
#epub-library-preview .cover-art::after{content:'';position:absolute;width:80%;height:45%;border:1px solid currentColor;transform:rotate(-25deg);border-radius:50%}
#epub-library-preview .cover-art i{z-index:1}
#epub-library-preview .book-title{display:block;width:100%;text-align:left;padding:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
#epub-library-preview .options{position:absolute;bottom:4px;right:4px;width:44px;height:44px;padding:10px}
#epub-library-preview .book-title{margin-top:8px}
#epub-library-preview .group-tile{padding-bottom:44px}
#epub-library-preview .fan{background:transparent;overflow:hidden}
#epub-library-preview .fan .cover-art{position:absolute;width:58%;height:76%;top:14%;left:21%;transform-origin:50% 100%;transform:rotate(var(--angle));box-shadow:0 2px 5px light-dark(#25382733,#00000066)}
#epub-library-preview .fan .cover-art:only-of-type{transform:none}
#epub-library-preview .group-count{position:absolute;bottom:7px;left:10px;color:var(--secondaryInk);font-size:14px}
#epub-library-preview .empty-cover{font-size:64px;font-weight:500;color:var(--secondaryInk);background:var(--soft);width:100%;height:100%;display:grid;place-items:center;border-radius:4px}
#epub-library-preview .floating-add{position:absolute;right:24px;bottom:24px;z-index:2;width:56px;height:56px;padding:16px;display:grid;place-items:center;border-radius:18px;background:var(--accent);color:var(--accentInk);box-shadow:0 3px 10px light-dark(#25382733,#00000066)}
#epub-library-preview .floating-add[hidden]{display:none}
#epub-library-preview .floating-add svg{width:24px;height:24px}
#epub-library-preview .phone[data-has-add="true"] .content{padding-bottom:88px}
#epub-library-preview .sheet{position:absolute;inset:0;background:var(--paper);z-index:3;padding:24px 18px;overflow:auto;border-radius:23px}
#epub-library-preview .sheet[hidden]{display:none}
#epub-library-preview .sheet label{display:block;margin:14px 0 6px}
#epub-library-preview .sheet input{width:100%}
#epub-library-preview .sheet dl{margin:20px 0}
#epub-library-preview .sheet dt{color:var(--secondaryInk);margin-top:16px}
#epub-library-preview .sheet dd{margin:4px 0;overflow-wrap:anywhere}
#epub-library-preview .sheet button.action{width:100%;text-align:left;border-bottom:1px solid var(--line);border-radius:0}
#epub-library-preview .primary{background:var(--accent);color:var(--accentInk);margin-top:20px;width:100%}
#epub-library-preview .notice{font-size:14px;color:var(--secondaryInk);margin-top:18px}
#epub-library-preview .suggestion{width:100%;text-align:left;background:var(--soft);margin-top:6px}
#epub-library-preview .checks label{display:flex;align-items:center;gap:10px}
#epub-library-preview .checks input{width:20px;min-height:20px}
#epub-library-preview .empty{padding:28px 0;color:var(--secondaryInk)}
</style>
<script>
(() => {
  const root=document.getElementById('epub-library-preview');
  const initialBooks=[
    {id:1,title:'The Clockmaker and the Library at the End of the World',authors:['Elson Madara'],date:'2024',downloaded:true},
    {id:2,title:'A Map of Quiet Places',authors:['Elson Madara','Maya Reed'],date:'2022-06-14',downloaded:false},
    {id:3,title:'Notes from the Orchard',authors:['Maya Reed'],date:'',downloaded:true}
  ];
  const saved=window.openai?.widgetState?.privateContent || {};
  const screens=[];
  const escape=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'library tiles',views:screens.map(s=>({design:s.name,tab:s.tab,opened:s.group}))},privateContent:{views:screens.map(s=>({name:s.name,tab:s.tab,group:s.group,sort:s.sort,query:s.query}))}}).catch(()=>{});}
  for(const variant of root.children){
    const restored=(saved.views || []).find(s=>s.name===variant.dataset.variant);
    const state={name:variant.dataset.variant,tab:restored?.tab || 'All',group:restored?.group || '',sort:restored?.sort || 'title',query:restored?.query || '',books:initialBooks.map(b=>({...b,authors:[...b.authors]})),collections:[{name:'Weekend reads',ids:[1,2]},{name:'To explore',ids:[]}]};
    screens.push(state);
    const tabIcons={All:'book-open',Collections:'library-big',Authors:'user-round'};
    variant.innerHTML=`<div class="phone" aria-label="${escape(state.name)} library design"><header class="appbar"><h2>Cloud EPUB</h2><button class="settings-button cursor-interaction" data-settings aria-label="Settings" data-tooltip="Settings"><i data-lucide="settings" aria-hidden="true"></i></button></header><nav class="tabs" aria-label="Library tabs">${['All','Collections','Authors'].map(t=>`<button class="cursor-interaction" data-tab="${t}" aria-label="${t}" data-tooltip="${t}" aria-pressed="${t===state.tab}"><i data-lucide="${tabIcons[t]}" aria-hidden="true"></i></button>`).join('')}</nav><div class="heading"></div><div class="tools"><input aria-label="Search library" placeholder="Search books" value="${escape(state.query)}"><select aria-label="Sort books"><option value="title">Title A–Z</option><option value="title-desc">Title Z–A</option><option value="year-desc">Newest year</option><option value="year">Oldest year</option></select></div><main class="content"></main><button class="floating-add cursor-interaction" data-add aria-label="Add book" data-tooltip="Add book"><i data-lucide="plus" aria-hidden="true"></i></button><div class="sheet" hidden></div></div>`;
    const phone=variant.querySelector('.phone'),content=phone.querySelector('.content'),sheet=phone.querySelector('.sheet'),query=phone.querySelector('input'),sort=phone.querySelector('select'),add=phone.querySelector('[data-add]');
    sort.value=state.sort;
    function render(){
      phone.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===state.tab));
      phone.querySelector('.heading').innerHTML=state.group?`<button class="cursor-interaction" data-back>← Back</button><h3>${escape(state.group)}</h3>`:`<h3>${state.tab==='All'?'All books':state.tab}</h3>`;
      query.placeholder=state.group || state.tab==='All'?'Search books':`Search ${state.tab.toLowerCase()}`;
      sort.hidden=state.tab!=='All' && !state.group;
      add.hidden=!!state.group || state.tab==='Authors';
      phone.dataset.hasAdd=String(!add.hidden);
      add.setAttribute('aria-label',state.tab==='Collections'?'Add Collection':'Add book');
      add.setAttribute('data-tooltip',state.tab==='Collections'?'Add Collection':'Add book');
      add.toggleAttribute('data-create',state.tab==='Collections' && !state.group);
      const words=state.query.toLocaleLowerCase('en').trim().split(/\s+/).filter(Boolean);
      if(state.tab!=='All' && !state.group){
        const groups=state.tab==='Collections'?state.collections.map(c=>({name:c.name,books:state.books.filter(b=>c.ids.includes(b.id))})):[...new Set(state.books.flatMap(b=>b.authors.length?b.authors:['Unknown author']))].map(name=>({name,books:state.books.filter(b=>name==='Unknown author'?!b.authors.length:b.authors.includes(name))}));
        content.innerHTML=`<div class="books">`+groups.filter(g=>words.every(w=>g.name.toLowerCase().includes(w))).sort((a,b)=>a.name.localeCompare(b.name,'en')).map(g=>{
          const covers=g.books.slice().sort((a,b)=>a.title.localeCompare(b.title,'en') || a.id-b.id).slice(0,3);
          return `<article class="book group-tile"><button class="cover fan cursor-interaction" data-group="${escape(g.name)}" aria-label="Open ${escape(g.name)}, ${g.books.length} books">${covers.length?covers.map((b,i)=>`<span class="cover-art" data-art="${b.id}" style="--angle:${covers.length===1?0:(i-(covers.length-1)/2)*24}deg" aria-hidden="true"><i data-lucide="book-open"></i></span>`).join(''):'<span class="empty-cover" aria-hidden="true">?</span>'}</button><button class="book-title cursor-interaction" data-group="${escape(g.name)}" data-tooltip="${escape(g.name)}">${escape(g.name)}</button><span class="group-count">${g.books.length} ${g.books.length===1?'book':'books'}</span>${state.tab==='Collections'?`<button class="options cursor-interaction" data-collection-options="${escape(g.name)}" aria-label="Options for ${escape(g.name)}"><i data-lucide="ellipsis-vertical" aria-hidden="true"></i></button>`:''}</article>`;
        }).join('')+`</div>`;
        if(globalThis.lucide)lucide.createIcons({attrs:{width:22,height:22}});
        return;
      }
      let books=state.books.filter(b=>!state.group || (state.tab==='Collections'?state.collections.find(c=>c.name===state.group)?.ids.includes(b.id):state.group==='Unknown author'?!b.authors.length:b.authors.includes(state.group))).filter(b=>words.every(w=>(b.title+' '+b.authors.join(' ')).toLowerCase().includes(w)));
      books.sort((a,b)=>{const tie=a.title.localeCompare(b.title,'en',{sensitivity:'base'}) || a.id-b.id;if(state.sort.startsWith('year')){if(!a.date || !b.date)return !a.date && !b.date?tie:!a.date?1:-1;return (Number(a.date.slice(0,4))-Number(b.date.slice(0,4)))*(state.sort==='year-desc'?-1:1) || tie;}return state.sort==='title-desc'?-a.title.localeCompare(b.title,'en',{sensitivity:'base'}) || a.id-b.id:tie;});
      content.innerHTML=books.length?`<div class="books">${books.map(b=>`<article class="book"><button class="cover cursor-interaction" data-open="${b.id}" aria-label="Open ${escape(b.title)}"><span class="cover-art" data-art="${b.id}" aria-hidden="true"><i data-lucide="book-open"></i></span></button><button class="book-title cursor-interaction" data-details="${b.id}" data-tooltip="${escape(b.title)}" aria-label="Details for ${escape(b.title)}">${escape(b.title)}</button><button class="options cursor-interaction" data-options="${b.id}" aria-label="Options for ${escape(b.title)}"><i data-lucide="ellipsis-vertical" aria-hidden="true"></i></button></article>`).join('')}</div>`:'<p class="empty">No books found.</p>';
      if(globalThis.lucide)lucide.createIcons({attrs:{width:22,height:22}});
    }
    function show(markup){sheet.innerHTML='<button class="cursor-interaction" data-close>← Library</button>'+markup;sheet.hidden=false;sheet.querySelector('[data-close]').focus();}
    function details(book){show(`<h3>${escape(book.title)}</h3><dl><dt>Authors</dt><dd>${escape(book.authors.join(', ') || 'Unknown author')}</dd><dt>Release date</dt><dd>${escape(book.date || 'Unknown')}</dd><dt>On this device</dt><dd>${book.downloaded?'Downloaded':'Not downloaded'}</dd><dt>Collections</dt><dd>${escape(state.collections.filter(c=>c.ids.includes(book.id)).map(c=>c.name).join(', ') || 'None')}</dd></dl><button class="primary cursor-interaction" data-edit="${book.id}">Edit author / release date</button>`);}
    phone.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button)return;
      if(button.hasAttribute('data-add') && state.tab==='All')show(`<h3>Add a book</h3><button class="action cursor-interaction" data-import-source="Device">From device</button><button class="action cursor-interaction" data-import-source="Google Drive">From Google Drive</button>`);
      if(button.dataset.importSource)show(`<h3>Import from ${escape(button.dataset.importSource)}</h3><p class="notice">EPUB selection preview</p>`);
      if(button.hasAttribute('data-settings'))show(`<h3>Settings</h3><h4>Account</h4><button class="action cursor-interaction" data-settings-section="Account information">Account information</button><button class="action cursor-interaction" data-settings-section="Password and recovery">Password and recovery</button><button class="action cursor-interaction" data-settings-section="Recovery package">Recovery package</button><button class="action cursor-interaction" data-settings-section="Devices">Devices</button><button class="action cursor-interaction" data-settings-section="Cloud account status">Cloud account status</button><button class="action cursor-interaction" data-settings-section="Sign out">Sign out</button>`);
      if(button.dataset.settingsSection)show(`<h3>${escape(button.dataset.settingsSection)}</h3><p class="notice">Account controls preview</p>`);
      if(button.dataset.tab){state.tab=button.dataset.tab;state.group='';state.query='';query.value='';sheet.hidden=true;render();remember();}
      if(button.hasAttribute('data-back')){state.group='';state.query='';query.value='';render();remember();}
      if(button.dataset.group){state.group=button.dataset.group;state.query='';query.value='';render();remember();}
      if(button.dataset.collectionOptions)show(`<h3>${escape(button.dataset.collectionOptions)}</h3><button class="action cursor-interaction" data-group="${escape(button.dataset.collectionOptions)}" data-close>View books</button><p class="notice">Collection actions: rename, delete, add or remove books.</p>`);
      if(button.hasAttribute('data-close')){sheet.hidden=true;phone.querySelector('.tabs button').focus();}
      const id=Number(button.dataset.details || button.dataset.options || button.dataset.open || button.dataset.edit || button.dataset.download || button.dataset.membership);
      const book=state.books.find(b=>b.id===id);
      if(button.dataset.details)details(book);
      if(button.dataset.options)show(`<h3>${escape(book.title)}</h3><button class="action cursor-interaction" data-details="${id}">View details</button><button class="action cursor-interaction" data-edit="${id}">Edit author / release date</button><button class="action cursor-interaction" data-membership="${id}">Collection membership</button>${book.downloaded?'':`<button class="action cursor-interaction" data-download="${id}">Download</button>`}`);
      if(button.dataset.open || button.dataset.download)show(`<h3>${escape(book.title)}</h3><p>${book.downloaded?'Resume reading':'Download and open'}</p><p class="notice">${book.downloaded?'Reader destination preview':'Download interaction preview; no file is transferred'}</p>`);
      if(button.dataset.edit){show(`<h3>Edit book details</h3><label>Author</label><input class="author-input" aria-label="Author" value="${escape(book.authors[0] || '')}"><div class="suggestions"></div><p class="notice">${book.authors.length>1?'Other author retained: '+escape(book.authors.slice(1).join(', ')):''}</p><label>Release date or year</label><input class="date-input" aria-label="Release date or year" placeholder="2024 or 2024-06-14" value="${escape(book.date)}"><button class="primary cursor-interaction" data-save="${id}">Save</button>`);}
      if(button.dataset.suggest){sheet.querySelector('.author-input').value=button.dataset.suggest;sheet.querySelector('.suggestions').innerHTML='';}
      if(button.dataset.save){const selected=state.books.find(b=>b.id===Number(button.dataset.save)),author=sheet.querySelector('.author-input').value.trim();selected.authors=author?[author,...selected.authors.slice(1)]:selected.authors.slice(1);selected.date=sheet.querySelector('.date-input').value.trim();render();details(selected);remember();}
      if(button.dataset.membership){show(`<h3>Collections</h3><div class="checks">${state.collections.map((c,i)=>`<label><input type="checkbox" data-member="${id}" data-index="${i}" ${c.ids.includes(id)?'checked':''}>${escape(c.name)}</label>`).join('')}</div>`);}
      if(button.hasAttribute('data-create'))show(`<h3>Add Collection</h3><label>Collection name</label><input class="collection-name" aria-label="Collection name"><div class="checks">${state.books.map(b=>`<label><input type="checkbox" data-pick="${b.id}">${escape(b.title)}</label>`).join('')}</div><button class="primary cursor-interaction" data-create-save>Create Collection</button><p class="notice" role="alert"></p>`);
      if(button.hasAttribute('data-create-save')){const name=sheet.querySelector('.collection-name').value.trim();if(!name || state.collections.some(c=>c.name.toLowerCase()===name.toLowerCase())){sheet.querySelector('[role=alert]').textContent='Enter a unique Collection name.';return;}state.collections.push({name,ids:[...sheet.querySelectorAll('[data-pick]:checked')].map(i=>Number(i.dataset.pick))});sheet.hidden=true;render();remember();}
    });
    phone.addEventListener('input',event=>{
      if(event.target===query){state.query=query.value;render();remember();}
      if(event.target.classList.contains('author-input')){const value=event.target.value.trim().replace(/\s+/g,' ').toLowerCase(),names=[...new Set(state.books.flatMap(b=>b.authors))];sheet.querySelector('.suggestions').innerHTML=value?names.filter(n=>n.toLowerCase().includes(value)).map(n=>`<button class="suggestion cursor-interaction" data-suggest="${escape(n)}">Use ${escape(n)}</button>`).join('')+`<button class="suggestion cursor-interaction" data-suggest="${escape(event.target.value.trim())}">Create new author “${escape(event.target.value.trim())}”</button>`:'';}
    });
    phone.addEventListener('change',event=>{if(event.target===sort){state.sort=sort.value;render();remember();}if(event.target.dataset.member){const collection=state.collections[Number(event.target.dataset.index)],id=Number(event.target.dataset.member);collection.ids=event.target.checked?[...new Set([...collection.ids,id])]:collection.ids.filter(i=>i!==id);render();remember();}});
    state.restore=view=>{state.tab=view.tab;state.group=view.group || '';state.query=view.query || '';state.sort=view.sort || 'title';query.value=state.query;sort.value=state.sort;render();};
    render();
    if(globalThis.Tweak){
      const design={coverHeight:156,collectionIcon:'library-big',authorIcon:'user-round'};
      const tweak=new Tweak({container:phone,onChange:()=>{
        phone.querySelectorAll('.cover').forEach(c=>c.style.height=design.coverHeight+'px');
        phone.querySelector('[data-tab="Collections"]').innerHTML=`<i data-lucide="${design.collectionIcon}" aria-hidden="true"></i>`;
        phone.querySelector('[data-tab="Authors"]').innerHTML=`<i data-lucide="${design.authorIcon}" aria-hidden="true"></i>`;
        if(globalThis.lucide)lucide.createIcons({attrs:{width:24,height:24}});
      }});
      tweak.addSlider(design,'coverHeight',{label:'Cover height',min:100,max:220,step:10,unit:'px'});
      tweak.addSelect(design,'collectionIcon',{label:'Collections icon',options:[{label:'Grouped books',value:'library-big'},{label:'Folders',value:'folders'},{label:'Layers',value:'layers'}]});
      tweak.addSelect(design,'authorIcon',{label:'Authors icon',options:[{label:'Person',value:'user-round'},{label:'People',value:'users-round'},{label:'Contact',value:'contact-round'}]});
    }
  }
  window.addEventListener('openai:set_globals',event=>{const views=event.detail?.globals?.widgetState?.privateContent?.views;if(!views)return;for(const view of views){const state=screens.find(s=>s.name===view.name);if(state && ['All','Collections','Authors'].includes(view.tab))state.restore(view);}});
})();
</script>
